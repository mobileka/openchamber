name: Personal macOS Release

# Fork-only release channel: builds an unsigned macOS arm64 bundle on every
# merge to personal and publishes it as a GitHub release. The desktop app stages
# that release into its builds directory and applies it through the /Applications
# symlink, so macOS code signing and notarization are intentionally not used.
on:
  push:
    branches:
      - personal
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: personal-macos-release
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Get bundled OpenCode CLI version
        id: opencode_cli_version
        run: |
          VERSION=$(node -p "require('./package.json').dependencies['@opencode-ai/sdk']")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache bundled OpenCode CLI artifact
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: packages/electron/.cache/opencode-cli
          key: opencode-cli-${{ runner.os }}-arm64-${{ steps.opencode_cli_version.outputs.version }}
          restore-keys: |
            opencode-cli-${{ runner.os }}-arm64-

      - name: Compute personal release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BASE_VERSION=$(node -p "require('./packages/electron/package.json').version.replace(/[-+].*$/, '')")
          LATEST_TAG=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" \
            | node -e "let raw='';process.stdin.on('data',(chunk)=>raw+=chunk).on('end',()=>{try{const release=JSON.parse(raw);process.stdout.write(typeof release.tag_name==='string'?release.tag_name:'')}catch{process.stdout.write('')}})" \
            || true)
          VERSION=$(BASE_VERSION="$BASE_VERSION" LATEST_TAG="$LATEST_TAG" node packages/electron/scripts/personal-release-version.mjs)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Personal release version: $VERSION"

      - name: Stamp build metadata
        id: stamp
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUILT_AT=$(node -p "new Date().toISOString()")
          RELEASE_VERSION="$RELEASE_VERSION" BUILT_AT="$BUILT_AT" node - <<'NODE'
          const fs = require('node:fs');
          const file = 'packages/electron/package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.version = process.env.RELEASE_VERSION;
          pkg.buildSha = process.env.GITHUB_SHA;
          pkg.builtAt = process.env.BUILT_AT;
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          echo "builtAt=$BUILT_AT" >> "$GITHUB_OUTPUT"

      - name: Build Electron app (arm64, unsigned)
        working-directory: packages/electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -euo pipefail
          bun run build:web-assets
          bun run prepare:opencode-cli
          bun run verify:opencode-cli
          bun run bundle:main
          bun run rebuild:native
          ./node_modules/.bin/electron-builder --mac --arm64 --dir --publish=never -c.mac.identity=null
          bun run verify:opencode-cli:packaged

      - name: Ad-hoc sign the app bundle
        working-directory: packages/electron
        run: |
          set -euo pipefail
          APP_PATH="dist/mac-arm64/OpenChamber.app"
          test -d "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --strict "$APP_PATH"

      - name: Package update archive and release manifest
        working-directory: packages/electron
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_BUILT_AT: ${{ steps.stamp.outputs.builtAt }}
        run: |
          set -euo pipefail
          ASSET_NAME="OpenChamber-${RELEASE_VERSION}-mac-arm64.zip"
          rm -f "dist/$ASSET_NAME"
          ditto -c -k --sequesterRsrc --keepParent "dist/mac-arm64/OpenChamber.app" "dist/$ASSET_NAME"
          RELEASE_ASSET_PATH="dist/$ASSET_NAME" \
          RELEASE_MANIFEST_PATH="dist/personal-release.json" \
            node ./scripts/personal-release-manifest.mjs

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Personal ${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            packages/electron/dist/OpenChamber-${{ steps.version.outputs.version }}-mac-arm64.zip
            packages/electron/dist/personal-release.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
